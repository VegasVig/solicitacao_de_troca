<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel de Trocas — Vegas Vigilância</title>
<link rel="icon" href="assets/logovegas.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --preto:#0A0A0A; --grafite:#1E1E1E; --grafite2:#2A2A2A;
  --cinza:#8A8A8A; --prata:#C0C0C0; --prata-claro:#E8E8E8;
  --ok:#3ECF8E; --erro:#E5484D; --alerta:#F5A524; --borda:rgba(192,192,192,.18);
}
*{box-sizing:border-box}
body{margin:0;background:var(--preto);color:var(--prata-claro);
  font-family:'Rajdhani',system-ui,sans-serif;font-size:16px}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(1000px 520px at 50% -10%,rgba(192,192,192,.09),transparent 70%),
  repeating-linear-gradient(0deg,rgba(192,192,192,.03) 0 1px,transparent 1px 46px),
  repeating-linear-gradient(90deg,rgba(192,192,192,.03) 0 1px,transparent 1px 46px)}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:20px 16px 70px}
h1{font-family:'Orbitron',sans-serif;font-size:20px;letter-spacing:.14em;text-transform:uppercase;margin:12px 0 4px;
  background:linear-gradient(180deg,#fff,var(--prata) 60%,var(--cinza));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--cinza);font-size:13px;letter-spacing:.2em;text-transform:uppercase}
.card{background:linear-gradient(180deg,rgba(42,42,42,.55),rgba(30,30,30,.55));border:1px solid var(--borda);
  border-radius:16px;backdrop-filter:blur(9px)}

/* login */
#login{min-height:88vh;display:grid;place-items:center}
#login .box{max-width:400px;width:100%;padding:32px 24px;text-align:center}
#login img{height:80px;margin-bottom:8px}
input,select,textarea{width:100%;background:#141414;color:var(--prata-claro);border:1px solid var(--borda);
  border-radius:10px;padding:12px 13px;font-family:inherit;font-size:16px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--prata);box-shadow:0 0 0 3px rgba(192,192,192,.12)}
select,option{background-color:#141414;color:var(--prata-claro)}
.bt{padding:14px 18px;border:none;border-radius:11px;cursor:pointer;font-family:'Orbitron',sans-serif;
  font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  background:linear-gradient(180deg,var(--prata-claro),var(--prata) 55%,#9d9d9d);color:#0A0A0A}
.bt:disabled{opacity:.5;cursor:not-allowed}
.bt.ghost{background:none;border:1px solid var(--borda);color:var(--prata)}
.bt.aprova{background:linear-gradient(180deg,#6ee7b7,var(--ok));color:#052e1a}
.bt.recusa{background:linear-gradient(180deg,#ff9a9d,var(--erro));color:#3a0508}
.erro{color:#FF9A9D;font-size:14px;margin-top:10px;min-height:18px}

/* topo */
header.topo{display:flex;align-items:center;gap:14px;padding:6px 0 20px;flex-wrap:wrap}
header.topo img{height:56px}
header.topo .acoes{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:16px 14px}
.kpi .v{font-family:'Orbitron',sans-serif;font-size:28px;color:#fff;line-height:1}
.kpi .l{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--cinza);margin-top:7px}
.kpi.p .v{color:var(--alerta)} .kpi.a .v{color:var(--ok)} .kpi.r .v{color:#FF9A9D}

/* filtros */
.filtros{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;padding:14px;margin-bottom:16px}
@media(max-width:820px){.filtros{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.filtros{grid-template-columns:1fr}}

/* ranking */
.duplo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
@media(max-width:820px){.duplo{grid-template-columns:1fr}}
.painel{padding:16px}
.painel h3{font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--prata);margin:0 0 14px}
.barra{margin-bottom:11px}
.barra .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.barra .top span:last-child{color:var(--cinza)}
.trilha{height:7px;background:#151515;border-radius:99px;overflow:hidden}
.trilha i{display:block;height:100%;background:linear-gradient(90deg,var(--cinza),var(--prata-claro));border-radius:99px}

/* lista */
.item{padding:16px;margin-bottom:12px}
.item .cab{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.proto{font-family:'Orbitron',sans-serif;font-size:15px;color:#fff;letter-spacing:.06em}
.tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border-radius:99px;border:1px solid}
.tag.pend{color:var(--alerta);border-color:rgba(245,165,36,.45);background:rgba(245,165,36,.08)}
.tag.apr{color:var(--ok);border-color:rgba(62,207,142,.45);background:rgba(62,207,142,.08)}
.tag.rec{color:#FF9A9D;border-color:rgba(229,72,77,.45);background:rgba(229,72,77,.08)}
.tag.n{color:var(--prata);border-color:var(--borda);background:rgba(0,0,0,.35)}
.tag.aguarda{color:#9FD4FF;border-color:rgba(120,180,255,.45);background:rgba(120,180,255,.09)}
.bt.doc{background:none;border:1px solid rgba(62,207,142,.5);color:var(--ok)}
.bt.copiado{border-color:var(--ok);color:var(--ok)}
.bt.excluir{background:none;border:1px solid rgba(229,72,77,.5);color:#FF9A9D}
.bt.excluir.confirmar{background:linear-gradient(180deg,#ff9a9d,var(--erro));color:#3a0508;border-color:var(--erro)}
.aviso-colega{margin-top:14px;padding:11px 13px;border-radius:10px;font-size:15px;
  border:1px solid rgba(120,180,255,.35);background:rgba(120,180,255,.06);color:#BFE1FF}
.item .quando{margin-left:auto;font-size:13px;color:var(--cinza)}
.rota{margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:17px}
.rota .de,.rota .para{border:1px solid var(--borda);border-radius:9px;padding:7px 12px;background:rgba(0,0,0,.35)}
.rota .para{border-color:rgba(192,192,192,.4);color:#fff}
.rota .seta{color:var(--prata);font-family:'Orbitron',sans-serif}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:14px}
.dado{font-size:15px}
.dado b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cinza);margin-bottom:2px;font-weight:600}
.motivo{margin-top:12px;padding:11px 13px;border-left:2px solid var(--prata);background:rgba(0,0,0,.35);
  border-radius:0 9px 9px 0;font-size:15px}
.assins{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}
.assin{flex:1;min-width:140px;text-align:center}
.assin img{width:100%;height:76px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--borda)}
.assin span{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cinza);margin-top:5px}
.item .botoes{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.vazio{text-align:center;padding:50px 20px;color:var(--cinza)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:50;display:none;
  padding:20px;overflow:auto;backdrop-filter:blur(4px)}
.modal.on{display:block}
.modal .box{max-width:520px;margin:20px auto;padding:22px}
.modal h3{font-family:'Orbitron',sans-serif;font-size:15px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 4px}
label{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--cinza);
  margin:14px 0 6px;font-weight:600}
.sigbox{border:1px solid var(--borda);border-radius:12px;background:#0f0f0f;overflow:hidden}
.sigbox canvas{display:block;width:100%;height:160px;touch-action:none;cursor:crosshair}
.sigbar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-top:1px solid var(--borda);background:rgba(0,0,0,.5)}
.sigbar span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cinza)}
textarea{min-height:80px;resize:vertical}

</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="box card">
    <img src="assets/logovegas.png" alt="Vegas">
    <h1>Painel de Trocas</h1>
    <div class="sub">Acesso restrito à supervisão</div>
    <div style="margin-top:22px">
      <input type="password" id="senha" placeholder="Senha do painel" autocomplete="current-password">
      <div class="erro" id="erroLogin"></div>
      <button class="bt" id="btLogin" style="width:100%;margin-top:8px">Entrar</button>
    </div>
  </div>
</div>

<!-- PAINEL -->
<div class="wrap" id="painel" style="display:none">
  <header class="topo">
    <img src="assets/logovegas.png" alt="Vegas">
    <div>
      <h1>Painel de Trocas</h1>
      <div class="sub" id="atualizado">—</div>
    </div>
    <div class="acoes">
      <button class="bt ghost" id="btRecarregar">Atualizar</button>
      <a class="bt ghost" href="index.html" style="text-decoration:none;display:inline-flex;align-items:center">Formulário</a>
      <button class="bt ghost" id="btSair">Sair</button>
    </div>
  </header>

  <div class="kpis" id="kpis"></div>

  <div class="filtros card">
    <input id="fBusca" placeholder="Buscar por nome, protocolo, posto, colega...">
    <select id="fStatus"><option value="">Todas as situações</option><option>Aguardando colega</option><option>Pendente</option><option>Aprovada</option><option>Recusada</option><option>Recusada pelo colega</option></select>
    <select id="fTipo"><option value="">Todos os tipos</option><option>Dia por dia</option><option>Turno por turno</option><option>Posto por posto</option></select>
    <select id="fMod"><option value="">Temporária e definitiva</option><option>Temporária</option><option>Definitiva</option></select>
  </div>

  <div class="duplo">
    <div class="painel card"><h3>Postos com mais pedidos</h3><div id="rkPostos"></div></div>
    <div class="painel card"><h3>Quem mais solicita</h3><div id="rkPessoas"></div></div>
  </div>

  <div id="lista"></div>
</div>

<!-- MODAL DECISÃO -->
<div class="modal" id="modal">
  <div class="box card">
    <h3 id="mTitulo">Aprovar troca</h3>
    <div class="sub" id="mProto">TRC-0000</div>
    <label>Nome do supervisor responsável</label>
    <input id="mSupervisor" placeholder="Quem está autorizando">
    <label id="mLabelObs">Observação (opcional)</label>
    <textarea id="mObs" maxlength="400" placeholder="Condições, ajustes na escala, alerta ao posto..."></textarea>
    <label>Assinatura do supervisor</label>
    <div class="sigbox">
      <canvas id="mSig"></canvas>
      <div class="sigbar"><span>Assine no campo acima</span><button class="bt ghost" id="mLimpar" style="padding:6px 12px;font-size:11px">Limpar</button></div>
    </div>
    <div class="erro" id="mErro"></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="bt ghost" id="mCancelar" style="flex:1">Cancelar</button>
      <button class="bt" id="mConfirmar" style="flex:2">Confirmar</button>
    </div>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxOP3VM3VUCXR-kFNJcwFrbFApDirg8oTYZn7uul-zTswrAnnAzB_sYUeL-_dYnSHHE/exec';
const $ = id => document.getElementById(id);
let SENHA = '', DADOS = [], LISTAS = {};

// ─────────── login
$('btLogin').addEventListener('click', entrar);
$('senha').addEventListener('keydown', e => { if(e.key==='Enter') entrar(); });

async function entrar(){
  const s = $('senha').value.trim();
  if(!s) return $('erroLogin').textContent = 'Digite a senha.';
  $('btLogin').disabled = true; $('btLogin').textContent = 'Verificando...';
  $('erroLogin').textContent = '';
  try{
    const r = await fetch(`${API_URL}?action=listar&senha=${encodeURIComponent(s)}`);
    const j = await r.json();
    if(!j.ok){ $('erroLogin').textContent = j.erro || 'Acesso negado.'; return; }
    SENHA = s; DADOS = j.dados || [];
    sessionStorage.setItem('vgTrocaSenha', s);
    $('login').style.display='none'; $('painel').style.display='block';
    carregarListas(); render();
  }catch(e){ $('erroLogin').textContent = 'Falha de conexão com o servidor.'; }
  finally{ $('btLogin').disabled=false; $('btLogin').textContent='Entrar'; }
}
(function auto(){ const s=sessionStorage.getItem('vgTrocaSenha'); if(s){ $('senha').value=s; entrar(); } })();
$('btSair').addEventListener('click',()=>{ sessionStorage.removeItem('vgTrocaSenha'); location.reload(); });

async function carregarListas(){
  try{ const r=await fetch(API_URL+'?action=listas'); const j=await r.json(); if(j.ok) LISTAS=j.listas; }catch(e){}
}

async function recarregar(){
  $('btRecarregar').textContent='...';
  try{
    const r = await fetch(`${API_URL}?action=listar&senha=${encodeURIComponent(SENHA)}`);
    const j = await r.json();
    if(j.ok){ DADOS = j.dados||[]; render(); }
  }catch(e){}
  $('btRecarregar').textContent='Atualizar';
}
$('btRecarregar').addEventListener('click', recarregar);
['fBusca','fStatus','fTipo','fMod'].forEach(id=>$(id).addEventListener('input', render));

// ─────────── render
function filtradas(){
  const q=$('fBusca').value.trim().toLowerCase(), st=$('fStatus').value, tp=$('fTipo').value, md=$('fMod').value;
  return DADOS.filter(d=>{
    if(st && d.status!==st) return false;
    if(tp && d.tipoTroca!==tp) return false;
    if(md && d.modalidade!==md) return false;
    if(q){ const alvo=[d.protocolo,d.nome,d.postoAtual,d.postoDestino,d.colegaNome,d.matricula,d.funcao].join(' ').toLowerCase();
      if(alvo.indexOf(q)<0) return false; }
    return true;
  });
}

function render(){
  const L = filtradas();
  const agu  = DADOS.filter(d=>d.status==='Aguardando colega').length;
  const pend = DADOS.filter(d=>d.status==='Pendente').length;
  const apr  = DADOS.filter(d=>d.status==='Aprovada').length;
  const rec  = DADOS.filter(d=>d.status==='Recusada').length;
  const dec  = apr+rec;
  const taxa = dec? Math.round(apr/dec*100) : 0;
  $('kpis').innerHTML = [
    ['','Total de pedidos', DADOS.length],
    ['','Aguardando o colega', agu],
    ['p','Aguardando decisão', pend],
    ['a','Aprovadas', apr],
    ['r','Recusadas', rec],
    ['','Taxa de aprovação', taxa+'%']
  ].map(([c,l,v])=>`<div class="kpi card ${c}"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');

  $('atualizado').textContent = 'Atualizado às ' + new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  ranking('rkPostos', contar(DADOS,'postoAtual'));
  ranking('rkPessoas', contar(DADOS,'nome'));

  if(!L.length){ $('lista').innerHTML='<div class="vazio card" style="padding:50px">Nenhuma solicitação com esses filtros.</div>'; return; }
  $('lista').innerHTML = L.map(cardItem).join('');
  document.querySelectorAll('[data-acao]').forEach(b=>b.addEventListener('click',async ()=>{
    const p=b.dataset.proto, a=b.dataset.acao;
    if(a==='pdf') return gerarPdf(p, b);
    if(a==='excluir') return excluirFicha(p, b);
    if(a==='copiar'){
      const d=DADOS.find(x=>x.protocolo===p); if(!d||!d.token) return;
      const url=linkColega(d.token);
      try{ await navigator.clipboard.writeText(url); }
      catch(e){ const t=document.createElement('textarea'); t.value=url; document.body.appendChild(t);
                t.select(); document.execCommand('copy'); t.remove(); }
      b.classList.add('copiado'); const txt=b.textContent; b.textContent='Link copiado';
      setTimeout(()=>{ b.classList.remove('copiado'); b.textContent=txt; },2500);
      return;
    }
    abrirModal(p, a);
  }));
}

function contar(arr,campo){
  const m={}; arr.forEach(d=>{ const k=(d[campo]||'—').trim(); if(k) m[k]=(m[k]||0)+1; });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,5);
}
function ranking(id,pares){
  if(!pares.length){ $(id).innerHTML='<div style="color:var(--cinza);font-size:14px">Sem dados ainda.</div>'; return; }
  const max=pares[0][1];
  $(id).innerHTML = pares.map(([k,v])=>`
    <div class="barra"><div class="top"><span>${esc(k)}</span><span>${v}</span></div>
    <div class="trilha"><i style="width:${Math.round(v/max*100)}%"></i></div></div>`).join('');
}

function rotaDe(d){
  if(d.tipoTroca==='Dia por dia')     return [d.dataOrigem||'—', d.dataDestino||'—'];
  if(d.tipoTroca==='Turno por turno') return [d.turnoAtual||'—', d.turnoDestino||'—'];
  return [d.postoAtual||'—', d.postoDestino||'—'];
}
function thumb(url){
  const m = String(url||'').match(/[-\w]{25,}/);
  return m ? `https://drive.google.com/thumbnail?id=${m[0]}&sz=w600` : '';
}
function tagStatus(s){
  const c = s==='Aprovada' ? 'apr'
          : (s==='Recusada' || s==='Recusada pelo colega') ? 'rec'
          : s==='Aguardando colega' ? 'aguarda' : 'pend';
  return `<span class="tag ${c}">${esc(s)}</span>`;
}
function linkColega(token){
  return new URL('assinar.html', location.href).href + '?t=' + encodeURIComponent(token);
}
function cardItem(d){
  const [de,para]=rotaDe(d);
  const per = d.modalidade==='Temporária' && d.periodoInicio ? `${br(d.periodoInicio)} a ${br(d.periodoFim)}` : '—';
  const doc = d.documento
    ? `<a class="bt doc" href="${esc(d.documento)}" target="_blank" rel="noopener"
         style="text-decoration:none;display:inline-flex;align-items:center">Abrir documento assinado</a>` : '';
  const acoesFicha = `<button class="bt ghost" data-acao="pdf" data-proto="${d.protocolo}">Gerar PDF</button>
                    <button class="bt excluir" data-acao="excluir" data-proto="${d.protocolo}">Excluir ficha</button>`;
  let botoes;
  if(d.status==='Pendente'){
    botoes = `<button class="bt aprova" data-acao="Aprovada" data-proto="${d.protocolo}">Aprovar</button>
              <button class="bt recusa" data-acao="Recusada" data-proto="${d.protocolo}">Recusar</button>
              ${doc}${acoesFicha}`;
  } else if(d.status==='Aguardando colega'){
    const wa = d.colegaTelefone ? '55'+String(d.colegaTelefone).replace(/\D/g,'') : '';
    const texto = encodeURIComponent(`Solicitação de troca ${d.protocolo} na Vegas: falta a sua assinatura. Assine aqui: ${d.token?linkColega(d.token):''}`);
    botoes = `${d.token?`<button class="bt ghost" data-acao="copiar" data-proto="${d.protocolo}">Copiar link do colega</button>`:''}
              ${d.token?`<a class="bt ghost" href="https://wa.me/${wa}?text=${texto}" target="_blank" rel="noopener"
                 style="text-decoration:none;display:inline-flex;align-items:center">Cobrar no WhatsApp</a>`:''}
              ${acoesFicha}`;
  } else {
    botoes = `${doc}${acoesFicha}`;
  }
  return `<div class="item card">
    <div class="cab">
      <span class="proto">${d.protocolo}</span>
      ${tagStatus(d.status)}
      <span class="tag n">${esc(d.tipoTroca)}</span>
      <span class="tag n">${esc(d.modalidade)}</span>
      <span class="quando">${esc(d.registro)}</span>
    </div>
    <div class="rota"><span class="de">${esc(de.length===10&&de.includes('-')?br(de):de)}</span>
      <span class="seta">→</span><span class="para">${esc(para.length===10&&para.includes('-')?br(para):para)}</span></div>
    <div class="grade">
      <div class="dado"><b>Solicitante</b>${esc(d.nome)}</div>
      <div class="dado"><b>CPF</b>${esc(d.cpf||'—')}</div>
      <div class="dado"><b>Função / escala</b>${esc(d.funcao||'—')} · ${esc(d.escala||'—')}</div>
      <div class="dado"><b>Posto atual</b>${esc(d.postoAtual)}</div>
      <div class="dado"><b>Turno atual</b>${esc(d.turnoAtual)}</div>
      <div class="dado"><b>Solicita a</b>${esc(d.colegaNome)}${d.colegaCpf?'<br>CPF '+esc(d.colegaCpf):''}${d.colegaTelefone?'<br>'+esc(d.colegaTelefone):''}</div>
      <div class="dado"><b>Posto do colega</b>${esc(d.colegaPosto||'—')}</div>
      <div class="dado"><b>Período</b>${per}</div>
      <div class="dado"><b>Contato</b>${esc(d.telefone)}</div>
      ${d.dataAssinColega?`<div class="dado"><b>Colega assinou em</b>${esc(d.dataAssinColega)}</div>`:''}
      ${(d.status==='Aprovada'||d.status==='Recusada')?`<div class="dado"><b>Decidido por</b>${esc(d.supervisor||'—')} · ${esc(d.dataDecisao||'')}</div>`:''}
    </div>
    <div class="motivo"><b style="color:var(--prata)">Motivo:</b> ${esc(d.motivo)}</div>
    ${d.status==='Aguardando colega'
      ? `<div class="aviso-colega">O colega ainda não assinou. A decisão fica liberada quando as duas assinaturas estiverem no documento.</div>`
      : ''}
    ${d.status==='Recusada pelo colega'
      ? `<div class="motivo" style="border-color:var(--erro)"><b style="color:#FF9A9D">O colega recusou:</b> ${esc(d.motivoRecusaColega||'sem motivo registrado')}</div>`
      : ''}
    ${d.observacao?`<div class="motivo" style="border-color:var(--alerta)"><b style="color:var(--alerta)">Observação da supervisão:</b> ${esc(d.observacao)}</div>`:''}
    <div class="assins">
      ${sigBloco(d.assinSolicitante,'Solicitante')}
      ${sigBloco(d.assinColega,'Colega')}
      ${d.assinSupervisor?sigBloco(d.assinSupervisor,'Supervisor'):''}
    </div>
    <div class="botoes">${botoes}</div>
  </div>`;
}
function sigBloco(url,rot){
  const t=thumb(url); if(!t) return '';
  return `<div class="assin"><img src="${t}" alt="assinatura ${rot}" loading="lazy"><span>${rot}</span></div>`;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function br(iso){ if(!iso) return '—'; if(iso.indexOf('/')>0) return iso; const p=iso.split('-'); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:iso; }

// ─────────── assinatura supervisor
function padAssinatura(id){
  const c=$(id), ctx=c.getContext('2d'); let on=false, vazio=true;
  function resize(){ const r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    c.width=r.width*dpr; c.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#E8E8E8'; vazio=true; }
  const pos=e=>{const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
  c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);on=true;vazio=false;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);});
  c.addEventListener('pointermove',e=>{if(!on)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();});
  c.addEventListener('pointerup',()=>on=false);
  c.addEventListener('pointerleave',()=>on=false);
  return { reset:resize, vazio:()=>vazio,
    limpar:()=>{ctx.clearRect(0,0,c.width,c.height);vazio=true;},
    dados:()=>{ const t=document.createElement('canvas');t.width=c.width;t.height=c.height;
      const g=t.getContext('2d');g.fillStyle='#FFFFFF';g.fillRect(0,0,t.width,t.height);g.drawImage(c,0,0);
      const d=g.getImageData(0,0,t.width,t.height),px=d.data;
      for(let i=0;i<px.length;i+=4){ if(px[i]>150&&px[i+1]>150&&px[i+2]>150&&px[i+3]===255&&
        !(px[i]===255&&px[i+1]===255&&px[i+2]===255)){px[i]=20;px[i+1]=20;px[i+2]=20;} }
      g.putImageData(d,0,0); return t.toDataURL('image/png'); } };
}
const padSup = padAssinatura('mSig');
$('mLimpar').addEventListener('click',()=>padSup.limpar());

let mAtual = { proto:'', status:'' };
function abrirModal(proto,status){
  mAtual={proto,status};
  $('mTitulo').textContent = status==='Aprovada' ? 'Aprovar troca' : 'Recusar troca';
  $('mProto').textContent = proto;
  $('mLabelObs').textContent = status==='Aprovada' ? 'Observação (opcional)' : 'Justificativa da recusa (obrigatória)';
  $('mConfirmar').className = 'bt ' + (status==='Aprovada'?'aprova':'recusa');
  $('mConfirmar').textContent = status==='Aprovada'?'Aprovar e assinar':'Recusar e assinar';
  $('mObs').value=''; $('mErro').textContent='';
  $('modal').classList.add('on');
  requestAnimationFrame(()=>{ padSup.reset(); padSup.limpar(); });
}
$('mCancelar').addEventListener('click',()=>$('modal').classList.remove('on'));

$('mConfirmar').addEventListener('click', async ()=>{
  const sup=$('mSupervisor').value.trim(), obs=$('mObs').value.trim();
  if(!sup) return $('mErro').textContent='Informe o nome do supervisor.';
  if(mAtual.status==='Recusada' && obs.length<10) return $('mErro').textContent='A recusa precisa de justificativa (mínimo 10 caracteres).';
  if(padSup.vazio()) return $('mErro').textContent='Assine no campo de assinatura.';
  const b=$('mConfirmar'); b.disabled=true; const txt=b.textContent; b.textContent='Registrando...';
  try{
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'decidir',senha:SENHA,protocolo:mAtual.proto,status:mAtual.status,
        supervisor:sup,observacao:obs,assinSupervisor:padSup.dados()})});
    const j=await r.json();
    if(!j.ok){ $('mErro').textContent=j.erro||'Não foi possível registrar.'; return; }
    $('modal').classList.remove('on');
    await recarregar();
  }catch(e){ $('mErro').textContent='Falha de conexão.'; }
  finally{ b.disabled=false; b.textContent=txt; }
});

// ─────────── gerar PDF (feito no servidor, com as assinaturas)
async function gerarPdf(proto, b){
  if(b.disabled) return;
  const txt=b.textContent; b.disabled=true; b.textContent='Gerando PDF...';
  // abre a aba já no clique para o navegador não bloquear
  const w = window.open('', '_blank');
  if(w) w.document.write('<p style="font-family:sans-serif;padding:20px">Gerando o PDF da troca '+proto+'...</p>');
  try{
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'gerarPdf',senha:SENHA,protocolo:proto})});
    const j=await r.json();
    if(!j.ok){ if(w) w.close(); alert(j.erro||'Não foi possível gerar o PDF.'); return; }
    const d=DADOS.find(x=>x.protocolo===proto); if(d) d.documento=j.documento;
    if(w) w.location.href=j.documento; else location.href=j.documento;
  }catch(e){ if(w) w.close(); alert('Falha de conexão ao gerar o PDF.'); }
  finally{ b.disabled=false; b.textContent=txt; }
}

// ─────────── excluir ficha (toque duas vezes)
async function excluirFicha(proto, b){
  if(b.disabled) return;
  if(!b.classList.contains('confirmar')){
    b.classList.add('confirmar');
    b.textContent='Tem certeza? Toque de novo';
    clearTimeout(b._t);
    b._t=setTimeout(()=>{ b.classList.remove('confirmar'); b.textContent='Excluir ficha'; },4000);
    return;
  }
  clearTimeout(b._t);
  b.disabled=true; b.textContent='Excluindo...';
  try{
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'excluir',senha:SENHA,protocolo:proto})});
    const j=await r.json();
    if(!j.ok){ alert(j.erro||'Não foi possível excluir.'); b.disabled=false;
      b.classList.remove('confirmar'); b.textContent='Excluir ficha'; return; }
    DADOS=DADOS.filter(x=>x.protocolo!==proto);
    render();
  }catch(e){ alert('Falha de conexão ao excluir.'); b.disabled=false;
    b.classList.remove('confirmar'); b.textContent='Excluir ficha'; }
}
</script>
